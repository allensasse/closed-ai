<!DOCTYPE html>

 <!DOCTYPE html>
<html lang="en">
<head> 
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Closed AI</title>
<style>
:root{--bg:#fff;--side:#f7f7f8;--text:#202123;--muted:#6b6b6b;--line:#e5e5e5;--hover:#ececec;--accent:#10a37f}
body.dark{--bg:#212121;--side:#171717;--text:#ececec;--muted:#aaa;--line:#383838;--hover:#303030}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}button{cursor:pointer}.app{height:100vh;display:flex}.side{width:255px;background:var(--side);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:800;padding:10px}.logo span{color:var(--accent)}
.new,.nav,.logout,.theme{border:0;border-radius:9px;background:transparent;color:var(--text);padding:11px;text-align:left;margin:2px 0}.new{border:1px solid var(--line);margin:10px 0 12px}.new:hover,.nav:hover,.logout:hover,.theme:hover{background:var(--hover)}.spacer{flex:1}.user{border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:58px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 18px}.content{flex:1;overflow:auto}.home{max-width:900px;margin:auto;padding:55px 22px 140px}.hero{text-align:center;margin:25px 0 32px}.hero h1{font-size:32px;margin:0 0 9px}.hero p{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:13px;padding:18px;background:var(--bg)}.card:hover{background:var(--hover)}.card b{display:block;margin-top:9px}.card small{color:var(--muted);line-height:1.4}.messages{display:flex;flex-direction:column;gap:20px;margin-top:30px}.msg{display:flex;gap:12px;line-height:1.55}.bubble{max-width:80%}.msg.user .bubble{background:var(--hover);padding:10px 14px;border-radius:16px}.avatar{width:29px;height:29px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.composer-wrap{position:fixed;bottom:0;left:255px;right:0;padding:15px 20px 20px;background:linear-gradient(transparent,var(--bg) 35%)}.composer{max-width:850px;margin:auto;border:1px solid var(--line);border-radius:15px;background:var(--bg);display:flex;padding:7px;box-shadow:0 5px 20px #0001}.composer input{flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:11px}.send{width:38px;height:38px;border:0;border-radius:9px;background:var(--text);color:var(--bg);font-weight:bold}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(430px,100%);padding:32px;border:1px solid var(--line);border-radius:18px}.authbox h1{margin-top:28px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}.primary{width:100%;border:0;background:var(--accent);color:#fff;padding:12px;border-radius:9px;font-weight:bold}.switch{text-align:center;color:var(--muted);margin-top:15px;font-size:14px}.switch span{color:var(--accent);cursor:pointer}.note{font-size:11px;color:var(--muted);text-align:center;margin-top:15px}.error{display:none;color:#b42318;background:#fff0f0;padding:9px;border-radius:8px;font-size:13px}
.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.modal{max-width:460px;width:100%;background:var(--bg);padding:25px;border-radius:16px}.modal li{margin:7px 0;color:var(--muted)}
@media(max-width:700px){.side{display:none}.composer-wrap{left:0}.cards{grid-template-columns:1fr}.home{padding:35px 15px 130px}}
</style></head><body><div id="root"></div>
<script>
const A="closed_accounts",S="closed_session",C="closed_chats",T="closed_theme";
let accounts=JSON.parse(localStorage.getItem(A)||"{}"),session=localStorage.getItem(S),chats=JSON.parse(localStorage.getItem(C)||"{}"),messages=[];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function save(){localStorage.setItem(A,JSON.stringify(accounts))}
function saveChats(){if(session){chats[session]=messages;localStorage.setItem(C,JSON.stringify(chats))}}
function applyTheme(){document.body.classList.toggle("dark",localStorage.getItem(T)==="dark")}
function toggleTheme(){localStorage.setItem(T,document.body.classList.contains("dark")?"light":"dark");applyTheme()}
function auth(login=false){root.innerHTML='<div class="auth"><div class="authbox"><div class="logo">Closed <span>AI</span></div><h1>'+(login?"Welcome back":"Create your account")+'</h1><p style="color:var(--muted)">'+(login?"Sign in to continue.":"Create an account to use Closed AI.")+'</p><div id="err" class="error"></div>'+(login?"":'<div class="field"><label>Name</label><input id="name" placeholder="Your name"></div>')+'<div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>'+(login?"":'<div class="field"><label>Phone number</label><input id="phone" placeholder="(555) 123-4567"></div>')+'<div class="field"><label>Password</label><input id="pw" type="password" placeholder="At least 6 characters"></div><button class="primary" onclick="'+(login?"login()":"signup()")+'">'+(login?"Log in":"Create account")+'</button><div class="switch">'+(login?"Don't have an account?":"Already have an account?")+' <span onclick="auth('+(login?"false":"true")+')">'+(login?"Create one":"Log in")+'</span></div><div class="note">This browser version stores account data locally. Do not use a real password.</div></div></div>'}
function bad(t){err.textContent=t;err.style.display="block"}
function signup(){let n=name.value.trim(),e=email.value.trim().toLowerCase(),p=phone.value.trim(),w=pw.value;if(!n||!e||!p||!w)return bad("Please fill in every field.");if(!e.includes("@"))return bad("Enter a valid email.");if(w.length<6)return bad("Password must be at least 6 characters.");if(Object.values(accounts).some(a=>a.email===e))return bad("That email is already registered.");let id=String(Date.now());accounts[id]={name:n,email:e,phone:p,password:w};save();session=id;localStorage.setItem(S,id);messages=[];saveChats();render()}
function login(){let e=email.value.trim().toLowerCase(),w=pw.value,id=Object.keys(accounts).find(k=>accounts[k].email===e&&accounts[k].password===w);if(!id)return bad("Incorrect email or password.");session=id;localStorage.setItem(S,id);messages=chats[id]||[];render()}
function logout(){session=null;localStorage.removeItem(S);messages=[];auth(true)}
function render(){let a=accounts[session];if(!a)return auth();root.innerHTML='<div class="app"><aside class="side"><div class="logo">Closed <span>AI</span></div><button class="new" onclick="newChat()">＋ New chat</button><button class="nav" onclick="home()">⌂ New chat</button><button class="nav" onclick="tool(\'Search\')">⌕ Search</button><button class="nav" onclick="tool(\'Images\')">▧ Images</button><button class="nav" onclick="tool(\'Files\')">▤ Files</button><div class="spacer"></div><button class="nav" onclick="plus()">✦ Closed Plus</button><button class="theme" onclick="toggleTheme()">◐ Black / White mode</button><div class="user"><b>'+esc(a.name)+'</b><br>'+esc(a.email)+'<br>'+esc(a.phone)+'<button class="logout" onclick="logout()">↪ Log out</button></div></aside><main class="main"><header class="top"><b>Closed AI</b><button class="theme" onclick="toggleTheme()">◐</button></header><div class="content"><div id="page" class="home"></div></div><div class="composer-wrap"><div class="composer"><input id="prompt" placeholder="Message Closed AI..." onkeydown="if(event.key===\'Enter\')send()"><button class="send" onclick="send()">↑</button></div></div></main></div>';applyTheme();home()}
function home(){page.innerHTML='<section class="hero"><h1>What can I help with?</h1><p>Ask anything, or choose a tool below.</p></section><div class="cards"><div class="card" onclick="tool(\'Search\')">🔎<b>Search</b><small>Find current information.</small></div><div class="card" onclick="tool(\'Images\')">🖼️<b>Images</b><small>Create and edit images.</small></div><div class="card" onclick="tool(\'Files\')">📁<b>Files</b><small>Work with documents.</small></div><div class="card" onclick="plus()">✦<b>Closed Plus</b><small>Explore upgraded features.</small></div></div><div id="messages" class="messages"></div>';draw()}
function draw(){let b=document.getElementById("messages");if(!b)return;b.innerHTML=messages.map(m=>'<div class="msg '+m.type+'"><div class="avatar">'+(m.type==="ai"?"C":esc(accounts[session].name[0]))+'</div><div class="bubble">'+esc(m.text)+'</div></div>').join("")}
function newChat(){messages=[];saveChats();home()}
function send(){let x=prompt.value.trim();if(!x)return;messages.push({type:"user",text:x});prompt.value="";draw();saveChats();setTimeout(()=>{messages.push({type:"ai",text:"Your message was received. This version has the new ChatGPT-style layout, account system, chat history, and black/white color mode."});draw();saveChats()},350)}
function tool(n){messages.push({type:"ai",text:n+" is available in the Closed AI interface. Connect a secure backend to make this feature live."});home();saveChats()}
function plus(){let d=document.createElement("div");d.className="overlay";d.innerHTML='<div class="modal"><h2>✦ Closed Plus</h2><p>Explore the upgraded Closed AI experience.</p><ul><li>Faster responses</li><li>More image tools</li><li>Better search</li><li>More memory</li><li>Larger file uploads</li></ul><button class="primary" onclick="this.parentElement.parentElement.remove()">Continue</button></div>';document.body.appendChild(d)}
applyTheme();if(session&&accounts[session]){messages=chats[session]||[];render()}else auth(false);
</script></body></html>
